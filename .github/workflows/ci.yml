name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend lint and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt

  backend-tests:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: educationhack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HR_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:postgres@localhost:5432/educationhack_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Generate the demo roster
        run: node demo/gen_seed.js
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Tests
        run: python -m pytest -q
        working-directory: backend

  smoke:
    name: Startup smoke test (Postgres)
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: educationhack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HR_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/educationhack
      HR_APP_ENV: production
      HR_SECRET_KEY: ci-only-secret-key-that-is-long-enough-to-pass
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Migrate an empty database
        run: alembic upgrade head
      - name: Start the API and wait for readiness
        run: |
          python -m uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/ready; then exit 0; fi
            sleep 1
          done
          cat uvicorn.log
          exit 1
      - name: Liveness, and everything else closed without a session
        run: |
          curl -fsS http://localhost:8000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/students)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/docs)" = 404

  stack:
    name: Production stack (Docker Compose, through Caddy)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Production settings for a throwaway stack
        run: |
          cp deploy/.env.example deploy/.env
          sed -i "s|^HR_DOMAIN=.*|HR_DOMAIN=localhost|" deploy/.env
          sed -i "s|^HR_CORS_ORIGINS=.*|HR_CORS_ORIGINS=https://localhost|" deploy/.env
          sed -i "s|^HR_SECRET_KEY=.*|HR_SECRET_KEY=$(openssl rand -hex 32)|" deploy/.env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" deploy/.env
      - name: Compose file is valid
        run: docker compose -f docker-compose.prod.yml --env-file deploy/.env config --quiet
      - name: Build and start
        run: docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build db migrate api worker web
      - name: Ready through Caddy
        run: |
          for i in $(seq 1 40); do
            if curl -fsSk https://localhost/api/ready; then break; fi
            sleep 3
          done
          curl -fsSk https://localhost/api/ready
      - name: Sign in end to end
        run: |
          echo "a-long-ci-only-password" | docker compose -f docker-compose.prod.yml --env-file deploy/.env \
            exec -T api python -m app.cli create-user ci@example.edu "CI Admin" admin --password-stdin
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/students)" = 401
          curl -fsSk -c jar -H 'X-Requested-With: ci' -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.edu","password":"a-long-ci-only-password"}' https://localhost/api/auth/login
          curl -fsSk -b jar https://localhost/api/auth/me | grep -q '"role":"admin"'
          curl -fsSk -o /dev/null https://localhost/
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file deploy/.env logs --no-color --tail 200

  demo:
    name: Public demo image (one container)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t student-support-demo .
      - name: Start as Render runs it (a PORT, no secret key given)
        run: |
          docker run -d --name demo -p 10000:10000 -e PORT=10000 student-support-demo
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:10000/api/ready; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:10000/api/ready
      - name: Interface, API and demo sign-in
        run: |
          curl -fsS http://localhost:10000/ | grep -q 'id="root"'
          curl -fsS http://localhost:10000/students/S-1507 | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/api/students)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/api/nope)" = 404
          # The cookie is Secure (the host serves HTTPS), so curl is told to send it over http here.
          curl -fsS -c jar -H 'X-Requested-With: ci' -H 'Content-Type: application/json' \
            -d '{"email":"admin@halverson.example.edu","password":"halverson-demo-2026"}' http://localhost:10000/api/auth/login
          sed -i 's/\t\/\tTRUE\t/\t\/\tFALSE\t/' jar
          curl -fsS -b jar http://localhost:10000/api/students | grep -q '"sid"'
      - name: The worker runs beside the API
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:10000/api/ready | grep -q '"worker_alive":true'; then exit 0; fi
            sleep 2
          done
          curl -fsS http://localhost:10000/api/ready
          exit 1
      - name: Logs
        if: always()
        run: docker logs demo 2>&1 | tail -n 80

  frontend:
    name: Frontend typecheck, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=high
