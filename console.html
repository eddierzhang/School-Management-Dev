      + (wl > 0
        ? '<button class="btn sm" data-act="section" data-code="' + esc(c.code) + '">Add section</button>'
        : '<button class="btn sm ghost" data-act="campaign" data-target="' + esc(c.code) + '" data-kind="course">Promote</button>')
      + '</td></tr>';
  });
  h += '</tbody></table></div></section>';
  return h;
}

const STAGE_PILL = { proposed: ['neutral', 'Proposed'], piloting: ['accent', 'Piloting'], approved: ['good', 'Approved'], scheduled: ['good', 'On the schedule'], shelved: ['neutral', 'Shelved'] };

function renderDemand() {
  const ranked = state.courses.map(c => ({ c, d: demandOf(c) })).sort((a, b) => b.d.score - a.d.score);
  const trend = state.courses.find(c => c.code === state.trendCourse) || (ranked[0] && ranked[0].c);
  const live = state.campaigns.filter(c => c.status === 'running');

  let h = '<section class="sec"><div class="sec-head"><h2>Demand &amp; promotion</h2><span class="spacer"></span>'
    + '<div class="segmented" role="group" aria-label="Demand view">'
    + '<button data-act="demand-view" data-v="chart" aria-pressed="' + (state.demandView === 'chart') + '">Chart</button>'
    + '<button data-act="demand-view" data-v="table" aria-pressed="' + (state.demandView === 'table') + '">Table</button>'
    + '</div></div>'
    + '<p class="sec-note">One index, three signals, no black box: how full a class is, how many students are stacked behind it, and how fast signups are still arriving. Classes at the top earn a section or a slot in the bulletin; classes at the bottom need the promotion.</p>'
    + '<div class="formula">demand = 100 × ( 0.40·seats_filled + 0.35·waitlist÷capacity + 0.25·signups_2wk÷(capacity×0.6) )</div>';

  if (state.demandView === 'chart') {
    h += '<div class="chartcard" style="margin-top:14px"><div class="chart-title">Demand index, every section</div>'
      + '<div class="chart-sub">Select a bar to read its weekly signups below. Index runs 0–100.</div>'
      + '<div class="chart-scroll">' + demandChart(ranked) + '</div></div>';
  } else {
    h += '<div class="tblwrap" style="margin-top:14px"><table class="tbl"><caption class="visually-hidden">Demand index and its three components for every section</caption><thead><tr>'
      + '<th scope="col">Class</th><th scope="col" class="num">Demand</th><th scope="col">Band</th>'
      + '<th scope="col" class="num">Seats filled</th><th scope="col" class="num">Waitlist ÷ cap</th>'
      + '<th scope="col" class="num">Signups, 2 wk</th><th scope="col"></th></tr></thead><tbody>';
    ranked.forEach(r => {
      const band = demandBand(r.d.score);
      h += '<tr><td><span class="code">' + esc(r.c.code) + '</span> ' + esc(r.c.title) + '</td>'
        + '<td class="num"><b>' + r.d.score + '</b></td><td>' + pillHTML(band.kind, band.label) + '</td>'
        + '<td class="num">' + pct(r.d.fill) + '%</td><td class="num">' + pct(r.d.pressure) + '%</td>'
        + '<td class="num">' + r.d.recent + '</td>'
        + '<td class="nowrap"><button class="btn sm ghost" data-act="trend" data-code="' + esc(r.c.code) + '">Signups</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }

  if (trend) {
    const d = demandOf(trend);
    h += '<div class="chartcard" style="margin-top:14px"><div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">'
      + '<div><div class="chart-title">Weekly signups — ' + esc(trend.title) + '</div>'
      + '<div class="chart-sub">Registration requests per week of term, including students who landed on the waitlist.</div></div>'
      + '<span class="spacer"></span>'
      + '<button class="btn sm promo" data-act="campaign" data-target="' + esc(trend.code) + '" data-kind="course">' + ICONS.megaphone + 'Promote this class</button>'
      + '</div><div class="chart-scroll">' + trendChart(trend) + '</div>'
      + '<p class="sub" style="margin:2px 0 6px">' + plural(d.recent, 'signup') + ' in the last two weeks · '
      + pct(d.fill) + '% of ' + trend.capacity + ' seats filled · ' + plural(waitlistOf(trend).length, 'student') + ' waiting</p></div>';
  }
  h += '</section>';

  h += '<section class="sec"><div class="sec-head"><h2>Initiatives students are asking for</h2><span class="spacer"></span>'
    + '<button class="btn sm" data-act="add-init">Log an initiative</button></div>'
    + '<p class="sec-note">Interest signals come off the September survey, waitlist rollover and counselor intake. An initiative that clears the bar gets a pilot; a pilot that holds gets a course code and shows up in registration.</p>'
    + '<div class="cards">';
  if (!state.initiatives.length) h += '<div class="empty">No initiative has been logged yet.</div>';
  state.initiatives.forEach(i => {
    const sp = STAGE_PILL[i.status] || ['neutral', i.status];
    const hot = (i.interest || 0) >= 60 && i.status !== 'scheduled' && i.status !== 'shelved';
    h += '<article class="icard' + (hot ? ' hot' : '') + '">'
      + '<div style="display:flex;gap:8px;align-items:flex-start"><h3 style="flex:1">' + esc(i.title) + '</h3>'
      + pillHTML(sp[0], sp[1]) + '</div>'
      + '<div class="interest"><b>' + (i.interest || 0) + '</b><span>interest signals · asks for ' + (i.askCapacity || 0) + ' seats</span></div>'
      + '<div class="why">' + esc(i.note || '') + '</div>'
      + '<div class="sub">' + esc(i.kind) + ' · ' + esc(i.window || 'Not scheduled') + ' · ' + esc(i.proposedBy)
      + (i.scheduledAs ? ' · now <span class="code">' + esc(i.scheduledAs) + '</span>' : '') + '</div>'
      + '<div class="foot">'
      + '<button class="btn sm" data-act="interest" data-id="' + esc(i.id) + '" data-d="1" aria-label="Record one more interest signal for ' + esc(i.title) + '">+1 interest</button>'
      + (i.status === 'scheduled' ? '' : '<button class="btn sm" data-act="advance" data-id="' + esc(i.id) + '">'
        + (i.status === 'shelved' ? 'Revive' : i.status === 'proposed' ? 'Start a pilot' : 'Approve') + '</button>')
      + ((i.status === 'piloting' || i.status === 'approved') ? '<button class="btn sm primary" data-act="schedule" data-id="' + esc(i.id) + '">Give it a course code</button>' : '')
      + '<button class="btn sm promo" data-act="campaign" data-target="' + esc(i.id) + '" data-kind="initiative">' + ICONS.megaphone + 'Promote</button>'
      + (i.status === 'shelved' || i.status === 'scheduled' ? '' : '<button class="btn sm ghost" data-act="shelve" data-id="' + esc(i.id) + '">Shelve</button>')
      + '</div></article>';
  });
  h += '</div></section>';

  h += '<section class="sec"><div class="sec-head"><h2>Promotion running now</h2>'
    + '<span class="sub">' + plural(live.length, 'campaign') + ' live</span></div>';
  if (!state.campaigns.length) h += '<div class="panelbox"><div class="qempty">Nothing is being promoted. Pick a class with seats to fill and write it a line.</div></div>';
  else {
    h += '<div class="tblwrap"><table class="tbl" style="min-width:600px"><thead><tr>'
      + '<th scope="col">Headline</th><th scope="col">Goes out on</th><th scope="col">Runs</th>'
      + '<th scope="col">Promoting</th><th scope="col"></th></tr></thead><tbody>';
    state.campaigns.forEach(c => {
      const tc = state.courses.find(x => x.code === c.target);
      const ti = state.initiatives.find(x => x.id === c.target);
      const name = tc ? tc.title : ti ? ti.title : c.target;
      h += '<tr><td><b>' + esc(c.headline) + '</b>' + (c.note ? '<div class="sub">' + esc(c.note) + '</div>' : '') + '</td>'
        + '<td class="nowrap sub">' + esc(c.channel) + '</td>'
        + '<td class="nowrap sub">' + shortDate(c.starts) + ' – ' + shortDate(c.ends) + '</td>'
        + '<td class="nowrap"><span class="code">' + esc(c.target) + '</span> <span class="sub">' + esc(name) + '</span></td>'
        + '<td class="nowrap">' + (c.status === 'running'
          ? '<button class="btn sm ghost" data-act="stop-campaign" data-id="' + esc(c.id) + '">End it</button>'
          : pillHTML('good', 'Ended')) + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</section>';
  return h;
}

/* ============================ drawer ================================== */
function openDrawer(d) { state.drawer = Object.assign({ form: {} }, d); render(); }
function closeDrawer() { state.drawer = null; render(); }
function dv(key, dflt) {
  const f = state.drawer && state.drawer.form || {};
  return f[key] !== undefined ? f[key] : (dflt === undefined ? '' : dflt);
}
function fld(key, label, opts) {
  const o = opts || {};
  const id = 'df-' + key;
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>'
    + '<input class="inp" id="' + id + '" data-form="' + key + '" type="' + (o.type || 'text') + '"'
    + (o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '')
    + (o.min != null ? ' min="' + o.min + '"' : '') + (o.max != null ? ' max="' + o.max + '"' : '')
    + ' value="' + esc(dv(key, o.value)) + '"></div>';
}
function sel(key, label, options, current) {
  const id = 'df-' + key;
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>'
    + '<select class="inp" id="' + id + '" data-form="' + key + '">'
    + options.map(o => '<option value="' + esc(o) + '"' + (dv(key, current) === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('')
    + '</select></div>';
}
const today = () => new Date(Date.UTC(2026, 8, 12)).toISOString().slice(0, 10);
const plusDays = n => { const d = new Date(Date.UTC(2026, 8, 12)); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

function drawerContent() {
  const d = state.drawer;
  if (!d) return null;

  if (d.kind === 'roster') {
    const c = state.courses.find(x => x.code === d.code);
    if (!c) return { title: 'Class not found', body: '<p class="sub">That section is no longer in the catalog.</p>', foot: '' };
    const en = enrolledOf(c), wl = waitlistOf(c);
    const left = seatsLeft(c);
    const dd = demandOf(c), band = demandBand(dd.score);
    const q = (d.q || '').trim().toLowerCase();
    const onRoster = new Set((c.roster || []).map(r => r.sid));
    const matches = q
      ? state.students.filter(s => !onRoster.has(s.sid) &&
        (s.name.toLowerCase().includes(q) || s.sid.toLowerCase().includes(q) || s.homeroom.toLowerCase().includes(q))).slice(0, 8)
      : [];

    let body = '<div class="block"><dl class="kv">'
      + '<dt>Course code</dt><dd><span class="code">' + esc(c.code) + '</span></dd>'
      + '<dt>Teacher</dt><dd>' + esc(c.teacher) + '</dd>'
      + '<dt>Meets</dt><dd>' + (c.period ? 'Period ' + c.period : 'Unscheduled') + ' in ' + esc(c.room) + '</dd>'
      + '<dt>Department</dt><dd>' + esc(c.dept) + '</dd>'
      + '<dt>Demand index</dt><dd>' + dd.score + ' &nbsp;' + pillHTML(band.kind, band.label) + '</dd>'
      + '</dl>'
      + (c.description ? '<p class="sub" style="margin:0">' + esc(c.description) + '</p>' : '') + '</div>';

    body += '<div class="block"><h3>Seats</h3>'
      + '<span class="meter-row">' + meterHTML(clamp(en.length / Math.max(1, c.capacity), 0, 1), wl.length ? 'critical' : left ? 'good' : 'warning')
      + '<span class="meter-lab">' + en.length + ' of ' + c.capacity + ' · ' + (left ? plural(left, 'seat') + ' open' : 'full') + '</span></span>'
      + '<div style="display:flex;align-items:center;gap:9px"><span class="sub">Section cap</span>'
      + '<span class="stepper"><button data-act="cap" data-code="' + esc(c.code) + '" data-d="-1" aria-label="Lower the cap">–</button>'
      + '<span class="n">' + c.capacity + '</span>'
      + '<button data-act="cap" data-code="' + esc(c.code) + '" data-d="1" aria-label="Raise the cap">+</button></span></div></div>';

    body += '<div class="block"><h3>Register a student</h3>'
      + '<input class="inp" id="stu-q" type="search" placeholder="Search the ' + state.students.length + '-student directory by name, ID or homeroom" value="' + esc(d.q || '') + '" data-act="stu-q">'
      + '<div class="searchres">' + matches.map(s =>
        '<div class="person"><span class="pn">' + esc(s.name) + '</span>'
        + '<span class="sub nowrap">Gr ' + s.grade + ' · ' + esc(s.homeroom) + '</span>'
        + '<button class="btn sm' + (left ? ' primary' : '') + '" data-act="enroll" data-code="' + esc(c.code) + '" data-sid="' + esc(s.sid) + '">'
        + (left ? 'Enroll' : 'Waitlist') + '</button></div>').join('') + '</div>'
      + (q && !matches.length ? '<p class="sub">No student matches “' + esc(d.q) + '” who is not already on this roster.</p>' : '')
      + (!q ? '<p class="sub">' + (left ? plural(left, 'seat') + ' open — a match enrolls straight away.' : 'This section is full, so the next student joins the waitlist at position ' + (wl.length + 1) + '.') + '</p>' : '')
      + '</div>';

    body += '<div class="block"><h3>Enrolled · ' + en.length + '</h3><div class="people scrolly">'
      + (en.length ? en.map(r => '<div class="person"><span class="pn">' + esc(r.name) + '</span>'
        + '<span class="sub nowrap">Gr ' + r.grade + ' · ' + shortDate(r.at) + '</span>'
        + '<button class="btn sm ghost" data-act="drop" data-code="' + esc(c.code) + '" data-sid="' + esc(r.sid) + '">Drop</button></div>').join('')
        : '<div class="person"><span class="sub">Nobody is enrolled yet.</span></div>') + '</div></div>';

    if (wl.length) body += '<div class="block"><h3>Waitlist · ' + wl.length + ' in order</h3><div class="people scrolly">'
      + wl.map((r, i) => '<div class="person"><span class="pos">' + (i + 1) + '</span><span class="pn">' + esc(r.name) + '</span>'
        + '<span class="sub nowrap">Gr ' + r.grade + '</span>'
        + '<button class="btn sm" data-act="promote" data-code="' + esc(c.code) + '" data-sid="' + esc(r.sid) + '"'
        + (left ? '' : ' disabled title="No open seat — raise the cap or open a section"') + '>Give a seat</button>'
        + '<button class="btn sm ghost" data-act="drop" data-code="' + esc(c.code) + '" data-sid="' + esc(r.sid) + '" aria-label="Remove ' + esc(r.name) + ' from the waitlist">Remove</button></div>').join('')
      + '</div></div>';

    const foot = (wl.length ? '<button class="btn primary" data-act="section" data-code="' + esc(c.code) + '">Open another section</button>' : '')
      + '<button class="btn promo" data-act="campaign" data-target="' + esc(c.code) + '" data-kind="course">' + ICONS.megaphone + 'Promote this class</button>';
    return { title: c.title, sub: '<span class="code">' + esc(c.code) + '</span> · section ' + esc(c.section || 'A') + ' · ' + esc(c.term || ''), body, foot };
  }

  if (d.kind === 'item') {
    const it = state.inventory.find(x => x.sku === d.sku);
    if (!it) return { title: 'Item not found', body: '<p class="sub">That SKU is no longer in the stockroom.</p>', foot: '' };
    const s = stockOf(it);
    const linked = (it.linkedCourses || []).map(code => state.courses.find(c => c.code === code)).filter(Boolean);
    let body = '<div class="block">' + pillHTML(s.kind, s.label)
      + '<span class="meter-row">' + meterHTML(s.ratio, s.kind, (it.reorderPoint || 0) / s.par)
      + '<span class="meter-lab">' + it.onHand + ' of ' + s.par + ' ' + esc(it.unit) + 's at par</span></span>'
      + '<dl class="kv"><dt>SKU</dt><dd><span class="code">' + esc(it.sku) + '</span></dd>'
      + '<dt>Category</dt><dd>' + esc(it.category) + '</dd>'
      + '<dt>Kept in</dt><dd>' + esc(it.location) + '</dd>'
      + '<dt>Supplier</dt><dd>' + esc(it.supplier) + '</dd>'
      + '<dt>Unit cost</dt><dd>' + money(it.unitCost || 0) + '</dd>'
      + '<dt>Value on hand</dt><dd>' + money((it.onHand || 0) * (it.unitCost || 0)) + '</dd>'
      + '<dt>Last counted</dt><dd>' + shortDate(it.lastCounted) + '</dd></dl></div>';

    body += '<div class="block"><h3>Physical count</h3>'
      + '<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">'
      + '<div class="field" style="flex:1;min-width:120px"><label for="df-count">Counted on the shelf</label>'
      + '<input class="inp" id="df-count" type="number" min="0" data-form="count" value="' + esc(dv('count', String(it.onHand || 0))) + '"></div>'
      + '<button class="btn primary" data-act="count" data-sku="' + esc(it.sku) + '">Record count</button></div>'
      + '<p class="sub" style="margin:0">Recording a count stamps today’s date and replaces the running total.</p></div>';

    body += '<div class="block"><h3>Thresholds</h3><div style="display:flex;gap:10px;flex-wrap:wrap">'
      + '<div style="display:flex;flex-direction:column;gap:4px"><span class="fact-k">Reorder at</span>'
      + '<span class="stepper"><button data-act="thresh" data-sku="' + esc(it.sku) + '" data-f="reorderPoint" data-d="-1" aria-label="Lower reorder point">–</button>'
      + '<span class="n">' + (it.reorderPoint || 0) + '</span>'
      + '<button data-act="thresh" data-sku="' + esc(it.sku) + '" data-f="reorderPoint" data-d="1" aria-label="Raise reorder point">+</button></span></div>'
      + '<div style="display:flex;flex-direction:column;gap:4px"><span class="fact-k">Par level</span>'
      + '<span class="stepper"><button data-act="thresh" data-sku="' + esc(it.sku) + '" data-f="par" data-d="-1" aria-label="Lower par level">–</button>'
      + '<span class="n">' + (it.par || 0) + '</span>'
      + '<button data-act="thresh" data-sku="' + esc(it.sku) + '" data-f="par" data-d="1" aria-label="Raise par level">+</button></span></div>'
      + '</div><p class="sub" style="margin:0">Reorder point triggers the flag; par is what a full shelf looks like.</p></div>';

    if (linked.length) body += '<div class="block"><h3>Classes drawing on this</h3>'
      + '<div class="people">' + linked.map(c => '<div class="person"><span class="pn">' + esc(c.title) + '</span>'
        + '<span class="sub nowrap">' + enrolledOf(c).length + ' enrolled</span>'
        + '<button class="btn sm ghost" data-act="roster" data-code="' + esc(c.code) + '">Roster</button></div>').join('')
      + '</div><p class="sub" style="margin:0">' + plural(linked.reduce((a, c) => a + enrolledOf(c).length, 0), 'student')
      + ' depend on this item this term.</p></div>';

    const foot = (it.requisitioned
      ? '<button class="btn" data-act="unreq" data-sku="' + esc(it.sku) + '">Remove from requisition</button>'
      : '<button class="btn primary" data-act="req" data-sku="' + esc(it.sku) + '">Add ' + shortfall(it) + ' to requisition</button>');
    return { title: it.name, sub: esc(it.category) + ' · ' + esc(it.location), body, foot };
  }

  if (d.kind === 'section') {
    const c = state.courses.find(x => x.code === d.code);
    if (!c) return { title: 'Class not found', body: '', foot: '' };
    const wl = waitlistOf(c);
    let body = '<p class="sub" style="margin:0">' + esc(c.title) + ' is carrying ' + plural(wl.length, 'student')
      + ' on its waitlist against a ' + c.capacity + '-seat cap. A second section takes them in registration order.</p>'
      + '<div class="block"><h3>The new section</h3>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      + fld('capacity', 'Seats', { type: 'number', min: 1, max: 120, value: String(c.capacity) })
      + fld('period', 'Period', { type: 'number', min: 0, max: 9, value: String(c.period || 0) })
      + fld('room', 'Room', { value: c.room })
      + fld('teacher', 'Teacher', { value: c.teacher })
      + '</div>'
      + fld('move', 'Move this many off the waitlist', { type: 'number', min: 0, max: String(wl.length), value: String(Math.min(wl.length, c.capacity)) })
      + '</div>';
    if (wl.length) body += '<div class="block"><h3>First in line</h3><div class="people scrolly">'
      + wl.slice(0, 8).map((r, i) => '<div class="person"><span class="pos">' + (i + 1) + '</span><span class="pn">' + esc(r.name)
        + '</span><span class="sub nowrap">Gr ' + r.grade + '</span></div>').join('')
      + '</div></div>';
    return {
      title: 'Open another section', sub: esc(c.title) + ' · <span class="code">' + esc(c.code) + '</span>', body,
      foot: '<button class="btn primary" data-act="do-section" data-code="' + esc(c.code) + '">Create the section</button>'
        + '<button class="btn ghost" data-act="close">Cancel</button>'
    };
  }

  if (d.kind === 'campaign') {
    const c = state.courses.find(x => x.code === d.target);
    const i = state.initiatives.find(x => x.id === d.target);
    const name = c ? c.title : i ? i.title : d.target;
    let suggest = '', why = '';
    if (c) {
      const left = seatsLeft(c), wl = waitlistOf(c).length;
      suggest = wl > 0
        ? name + ' has a waitlist — ask us about the next section'
        : plural(left, 'seat') + ' left in ' + name + (c.period ? ', period ' + c.period : '');
      why = wl > 0
        ? 'This class is full. Promotion here is about steering the overflow, not filling seats.'
        : left + ' of ' + c.capacity + ' seats are open and add/drop closes ' + shortDate(state.school && state.school.addDropCloses) + '.';
    } else if (i) {
      suggest = name + ' is forming — ' + (i.interest || 0) + ' students have already asked for it';
      why = 'An initiative at ' + (i.interest || 0) + ' signals, asking for ' + (i.askCapacity || 0) + ' seats.';
    }
    const body = '<p class="sub" style="margin:0">' + esc(why) + '</p>'
      + '<div class="block">'
      + '<div class="field"><label for="df-headline">Headline students will see</label>'
      + '<textarea class="inp" id="df-headline" rows="2" data-form="headline">' + esc(dv('headline', suggest)) + '</textarea></div>'
      + sel('channel', 'Goes out on', CHANNELS, CHANNELS[0])
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      + fld('starts', 'Starts', { type: 'date', value: today() })
      + fld('ends', 'Ends', { type: 'date', value: plusDays(14) })
      + '</div>'
      + '<div class="field"><label for="df-note">Internal note</label>'
      + '<input class="inp" id="df-note" data-form="note" placeholder="Who is following up, and on what" value="' + esc(dv('note')) + '"></div>'
      + '</div>';
    return {
      title: 'Promote ' + name, sub: '<span class="code">' + esc(d.target) + '</span> · ' + (c ? 'class' : 'initiative'), body,
      foot: '<button class="btn promo" data-act="do-campaign" data-target="' + esc(d.target) + '" data-kind="' + esc(d.targetKind) + '">Schedule it</button>'
        + '<button class="btn ghost" data-act="close">Cancel</button>'
    };
  }

  if (d.kind === 'schedule') {
    const i = state.initiatives.find(x => x.id === d.id);
    if (!i) return { title: 'Initiative not found', body: '', foot: '' };
    const depts = Array.from(new Set(state.courses.map(c => c.dept)));
    const body = '<p class="sub" style="margin:0">' + esc(i.title) + ' collected ' + (i.interest || 0)
      + ' interest signals and asks for ' + (i.askCapacity || 0) + ' seats. Give it a code and it becomes a registerable class.</p>'
      + '<div class="block">'
      + fld('code', 'Course code', { placeholder: 'e.g. TEC-140' })
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      + sel('dept', 'Department', depts, depts[0] || 'Career & Tech')
      + fld('capacity', 'Seats', { type: 'number', min: 1, max: 120, value: String(i.askCapacity || 20) })
      + fld('period', 'Period', { type: 'number', min: 0, max: 9, value: '0' })
      + fld('room', 'Room', { placeholder: 'TBD' })
      + '</div>'
      + fld('teacher', 'Teacher of record', { value: (i.proposedBy || '').split(',')[0] })
      + '</div>';
    return {
      title: 'Put it on the schedule', sub: esc(i.title), body,
      foot: '<button class="btn primary" data-act="do-schedule" data-id="' + esc(i.id) + '">Create the class</button>'
        + '<button class="btn ghost" data-act="close">Cancel</button>'
    };
  }

  if (d.kind === 'add-item') {
    const cats = Array.from(new Set(state.inventory.map(i => i.category)));
    const body = '<div class="block">'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      + fld('sku', 'SKU', { placeholder: 'ART-BRS-12' })
      + sel('category', 'Category', cats.length ? cats : ['Facilities'], cats[0] || 'Facilities')
      + '</div>'
      + fld('name', 'Item name', { placeholder: 'Bristle brush, size 12' })
      + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">'
      + fld('onHand', 'On hand', { type: 'number', min: 0, value: '0' })
      + fld('reorderPoint', 'Reorder at', { type: 'number', min: 0, value: '10' })
      + fld('par', 'Par level', { type: 'number', min: 1, value: '24' })
      + '</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      + fld('unit', 'Unit', { value: 'unit' })
      + fld('unitCost', 'Unit cost', { type: 'number', min: 0, value: '0' })
      + '</div>'
      + fld('location', 'Kept in', { placeholder: 'Main supply room' })
      + fld('supplier', 'Supplier', { placeholder: 'Central District Warehouse' })
      + '</div>';
    return {
      title: 'Add a stockroom item', sub: 'Counts start from what you enter here', body,
      foot: '<button class="btn primary" data-act="do-add-item">Add to the stockroom</button>'
        + '<button class="btn ghost" data-act="close">Cancel</button>'
    };
  }

  if (d.kind === 'add-init') {
    const body = '<div class="block">'
      + fld('title', 'What students are asking for', { placeholder: 'Sunrise Coding Club' })
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      + sel('kind', 'Shape', ['Club', 'Course section', 'Program'], 'Club')
      + fld('interest', 'Interest signals so far', { type: 'number', min: 0, value: '0' })
      + fld('askCapacity', 'Seats it asks for', { type: 'number', min: 1, value: '20' })
      + fld('window', 'When it would meet', { placeholder: 'Tue/Thu 7:15a' })
      + '</div>'
      + fld('proposedBy', 'Proposed by', { placeholder: 'M. Delacroix, Career & Tech' })
      + '<div class="field"><label for="df-note">Why it is worth a pilot</label>'
      + '<textarea class="inp" id="df-note" rows="3" data-form="note">' + esc(dv('note')) + '</textarea></div>'
      + '</div>';
    return {
      title: 'Log an initiative', sub: 'It lands on the demand board as proposed', body,
      foot: '<button class="btn primary" data-act="do-add-init">Add to the board</button>'
        + '<button class="btn ghost" data-act="close">Cancel</button>'
    };
  }

  if (d.kind === 'requisition') {
    const req = state.inventory.filter(i => i.requisitioned);
    const total = req.reduce((a, i) => a + shortfall(i) * (i.unitCost || 0), 0);
    const bySupplier = {};
    req.forEach(i => { (bySupplier[i.supplier] = bySupplier[i.supplier] || []).push(i); });
    let body = req.length ? '' : '<p class="sub" style="margin:0">Nothing is on the requisition yet.</p>';
    Object.keys(bySupplier).sort().forEach(sup => {
      const lines = bySupplier[sup];
      body += '<div class="block"><h3>' + esc(sup) + '</h3><div class="people">'
        + lines.map(i => '<div class="person"><span class="pn">' + esc(i.name)
          + '<div class="sub"><span class="code">' + esc(i.sku) + '</span> · ' + i.onHand + ' on hand of ' + i.par + ' at par</div></span>'
          + '<span class="sub nowrap">' + shortfall(i) + ' × ' + money(i.unitCost || 0) + '</span>'
          + '<button class="btn sm ghost" data-act="unreq" data-sku="' + esc(i.sku) + '" aria-label="Remove ' + esc(i.name) + ' from the requisition">Remove</button></div>').join('')
        + '</div><p class="sub" style="margin:0">' + money(lines.reduce((a, i) => a + shortfall(i) * (i.unitCost || 0), 0)) + ' from this supplier.</p></div>';
    });
    return {
      title: 'Open requisition', sub: plural(req.length, 'line') + ' · ' + money(total) + ' to reach par', body,
      foot: '<button class="btn ghost" data-act="close">Close</button>'
    };
  }
  return null;
}

function renderDrawer() {
  const root = $('#drawer-root');
  const content = drawerContent();
  if (!content) { root.innerHTML = ''; return; }
  root.innerHTML = '<button class="scrim" data-act="close" aria-label="Close panel"></button>'
    + '<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">'
    + '<div class="drawer-head"><div style="flex:1;min-width:0"><h2 id="drawer-title">' + esc(content.title) + '</h2>'
    + (content.sub ? '<div class="sub" style="margin-top:3px">' + content.sub + '</div>' : '') + '</div>'
    + '<button class="btn sm ghost" data-act="close" aria-label="Close panel">Close</button></div>'
    + '<div class="drawer-body" id="drawer-body">' + content.body + '</div>'
    + (content.foot ? '<div class="drawer-foot">' + content.foot + '</div>' : '')
    + '</aside>';
}

/* ============================ shell =================================== */
function notConnectedView() {
  return '<div class="empty"><h2>These records are not open in this view</h2>'
    + '<p class="sub" style="max-width:48ch;margin:0 auto">The stockroom counts, rosters and demand signals live with the published page. '
    + 'Open it on claude.ai and they load here, shared with everyone else who has it open.</p></div>';
}
function emptyStoreView() {
  return '<div class="empty"><h2>The term has no records yet</h2>'
    + '<p class="sub" style="max-width:48ch;margin:0 auto">Nothing has been added to the stockroom or the catalog. '
    + 'Add a stockroom item to get started.</p><p style="margin-top:14px">'
    + '<button class="btn primary" data-act="add-item">Add an item</button></p></div>';
}
function renderView() {
  if (!state.loaded) return '<div class="empty"><h2>Opening the term’s records…</h2></div>';
  if (!state.connected) return notConnectedView();
  if (!state.courses.length && !state.inventory.length) return emptyStoreView();
  if (state.tab === 'inventory') return renderInventory();
  if (state.tab === 'registration') return renderRegistration();
  if (state.tab === 'demand') return renderDemand();
  return renderOverview();
}

function snapFocus() {
  const el = document.activeElement;
  if (!el || !el.id) return null;
  const o = { id: el.id };
  try { if (typeof el.selectionStart === 'number') { o.s = el.selectionStart; o.e = el.selectionEnd; } } catch (e) {}
  return o;
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el) return;
  try { el.focus({ preventScroll: true }); } catch (e) { return; }
  if (f.s != null && el.setSelectionRange) { try { el.setSelectionRange(f.s, f.e); } catch (e) {} }
}

let rafPending = false;
function render() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    const focus = snapFocus();
    const scroll = $('#drawer-body') ? $('#drawer-body').scrollTop : 0;
    TIPS = [];
    renderMasthead();
    renderTabs();
    $('#view').innerHTML = renderView();
    renderDrawer();
    if ($('#drawer-body')) $('#drawer-body').scrollTop = scroll;
    restoreFocus(focus);
  });
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, kind) {
  const root = $('#toast-root');
  root.innerHTML = '<div class="toast' + (kind ? ' ' + kind : '') + '" role="status">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, kind === 'critical' ? 6500 : 4200);
}

/* ---------- tooltips (hover and keyboard alike) ---------- */
function showTip(idx, x, y) {
  const tip = $('#tip');
  if (tip.dataset.i !== String(idx)) { tip.innerHTML = TIPS[idx] || ''; tip.dataset.i = String(idx); }
  tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 10) left = Math.max(10, x - r.width - 14);
  if (top + r.height > innerHeight - 10) top = Math.max(10, y - r.height - 14);
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideTip() { const t = $('#tip'); t.classList.remove('on'); t.dataset.i = ''; }
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { if ($('#tip').classList.contains('on')) hideTip(); return; }
  showTip(+el.getAttribute('data-tip'), e.clientX, e.clientY);
}, { passive: true });
document.addEventListener('focusin', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { hideTip(); return; }
  const r = el.getBoundingClientRect();
  showTip(+el.getAttribute('data-tip'), r.left + Math.min(220, r.width / 2), r.bottom - 6);
});
document.addEventListener('mouseleave', hideTip);

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-act]');
  if (!t) return;
  const a = t.getAttribute('data-act');
  const g = k => t.getAttribute('data-' + k);
  const num = k => parseInt(g(k), 10);

  switch (a) {
    case 'tab': state.tab = g('tab'); hideTip(); render(); break;
    case 'close': closeDrawer(); break;
    case 'demand-view': state.demandView = g('v'); render(); break;
    case 'trend': state.trendCourse = g('code'); state.tab = 'demand'; hideTip(); render(); break;

    case 'item': openDrawer({ kind: 'item', sku: g('sku') }); break;
    case 'roster': openDrawer({ kind: 'roster', code: g('code') }); break;
    case 'section': openDrawer({ kind: 'section', code: g('code') }); break;
    case 'campaign': openDrawer({ kind: 'campaign', target: g('target'), targetKind: g('kind') }); break;
    case 'schedule': openDrawer({ kind: 'schedule', id: g('id') }); break;
    case 'add-item': openDrawer({ kind: 'add-item' }); break;
    case 'add-init': openDrawer({ kind: 'add-init' }); break;
    case 'req-view': openDrawer({ kind: 'requisition' }); break;

    case 'stock': adjustStock(g('sku'), num('d')); break;
    case 'count': countStock(g('sku'), dv('count')); break;
    case 'thresh': {
      const it = state.inventory.find(i => i.sku === g('sku'));
      if (it) setItemField(it.sku, g('f'), Math.max(g('f') === 'par' ? 1 : 0, (it[g('f')] || 0) + num('d')));
      break;
    }
    case 'req': requisition(g('sku'), true); break;
    case 'unreq': requisition(g('sku'), false); break;
    case 'req-all': requisitionAllLow(); break;

    case 'enroll': registerStudent(g('code'), g('sid')); break;
    case 'drop': dropStudent(g('code'), g('sid')); break;
    case 'promote': promoteFromWaitlist(g('code'), g('sid')); break;
    case 'cap': {
      const c = state.courses.find(x => x.code === g('code'));
      if (c) setCapacity(c.code, (c.capacity || 0) + num('d'));
      break;
    }
    case 'do-section': openSection(g('code'), state.drawer.form); break;
    case 'do-campaign': createCampaign({
      target: g('target'), targetKind: g('kind'),
      headline: dv('headline', ($('#df-headline') || {}).value || ''),
      channel: dv('channel', CHANNELS[0]),
      starts: dv('starts', today()), ends: dv('ends', plusDays(14)), note: dv('note')
    }); break;
    case 'do-schedule': scheduleInitiative(g('id'), state.drawer.form); break;
    case 'do-add-item': addItem(state.drawer.form); break;
    case 'do-add-init': addInitiative(state.drawer.form); break;

    case 'interest': bumpInterest(g('id'), num('d')); break;
    case 'advance': advanceInitiative(g('id')); break;
    case 'shelve': shelveInitiative(g('id')); break;
    case 'stop-campaign': stopCampaign(g('id')); break;

    case 'queue': case 'queue-alt': {
      const item = attentionItems()[num('i')];
      if (!item) break;
      const act = a === 'queue' ? item.action : item.alt;
      if (act && !act.disabled) act.fn();
      break;
    }
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-form]')) {
    if (!state.drawer) return;
    state.drawer.form[el.getAttribute('data-form')] = el.value;
    return;  /* no re-render: keeps the caret where the typist left it */
  }
  if (el.matches('[data-act="stu-q"]')) { if (state.drawer) { state.drawer.q = el.value; render(); } return; }
  if (el.matches('[data-act="filter"]')) {
    const key = el.getAttribute('data-key');
    state.filters[key] = el.type === 'checkbox' ? el.checked : el.value;
    render();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-form]') && state.drawer) state.drawer.form[el.getAttribute('data-form')] = el.value;
  if (el.matches('[data-act="filter"]')) {
    const key = el.getAttribute('data-key');
    state.filters[key] = el.type === 'checkbox' ? el.checked : el.value;
    render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.drawer) { closeDrawer(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.hit[data-act]')) {
    e.preventDefault();
    e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  }
});

/* ---------- boot ---------- */
function start(carried) {
  if (carried && carried.tab) {
    state.tab = carried.tab;
    if (carried.filters) Object.assign(state.filters, carried.filters);
    if (carried.trendCourse) state.trendCourse = carried.trendCourse;
  }
  render();
  connect();
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ tab: state.tab, filters: state.filters, trendCourse: state.trendCourse }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
} catch (e) { start({}); }
</script>
