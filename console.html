<title>Halverson Ridge Registrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---- tokens: light is the base; both dark scopes redefine tokens only ---- */
:root{
  color-scheme: light;
  --paper:#F1F4F0; --card:#FBFCFA; --card-2:#F5F8F4; --card-3:#EAEFE9;
  --ink:#131C19; --ink-2:#4E5D57; --muted:#78867F;
  --rule:#DFE5DE; --rule-strong:#C6CFC8;
  --accent:#00806A; --accent-ink:#00604F; --accent-wash:#E4F0EC; --accent-track:#CFE6DF;
  --signal:#B4611A; --signal-ink:#8E4A12; --signal-wash:#F7ECE1;
  --good:#0CA30C; --warning:#FAB219; --serious:#EC835A; --critical:#D03B3B;
  --good-wash:#E8F4E8; --warning-wash:#FCF2DC; --serious-wash:#FAEBE4; --critical-wash:#F8E6E6;
  --grid:#E5EAE4; --axis:#C6CFC8;
  --shadow-1:0 1px 2px rgba(19,28,25,.05);
  --shadow-2:0 2px 4px rgba(19,28,25,.06), 0 18px 40px -24px rgba(19,28,25,.34);
  --font-display:'Literata',Georgia,'Times New Roman',serif;
  --font-ui:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0D1211; --card:#161D1B; --card-2:#1C2522; --card-3:#222C28;
    --ink:#EDF2EE; --ink-2:#A9B8B1; --muted:#7E8C86;
    --rule:#27302D; --rule-strong:#39433F;
    --accent:#2FA88F; --accent-ink:#5CC4AC; --accent-wash:#12302A; --accent-track:#1E3B35;
    --signal:#E09A4C; --signal-ink:#EFB472; --signal-wash:#33260F;
    --good-wash:#11290F; --warning-wash:#312208; --serious-wash:#33190F; --critical-wash:#331313;
    --grid:#242D2A; --axis:#39433F;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.4), 0 18px 40px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0D1211; --card:#161D1B; --card-2:#1C2522; --card-3:#222C28;
  --ink:#EDF2EE; --ink-2:#A9B8B1; --muted:#7E8C86;
  --rule:#27302D; --rule-strong:#39433F;
  --accent:#2FA88F; --accent-ink:#5CC4AC; --accent-wash:#12302A; --accent-track:#1E3B35;
  --signal:#E09A4C; --signal-ink:#EFB472; --signal-wash:#33260F;
  --good-wash:#11290F; --warning-wash:#312208; --serious-wash:#33190F; --critical-wash:#331313;
  --grid:#242D2A; --axis:#39433F;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.4), 0 18px 40px -24px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.shell{max-width:1260px;margin:0 auto;padding-inline:20px;padding-block:0 72px}

/* ---- masthead ---- */
.masthead{background:var(--card);border-bottom:1px solid var(--rule)}
.masthead-in{max-width:1260px;margin:0 auto;padding-inline:20px;padding-block:14px;
  display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.crest{width:34px;height:34px;flex:none}
.mast-id{display:flex;align-items:center;gap:11px;margin-right:auto}
.mast-name{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.mast-sub{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.mast-facts{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
.fact{display:flex;flex-direction:column;gap:1px}
.fact-k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fact-v{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.live.off i{background:var(--muted)}

/* ---- module tabs ---- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-block:0 22px;
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;padding:13px 15px 11px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tab .count{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--card-3);color:var(--ink-2);border-radius:999px;padding:1px 7px}
.tab[aria-selected="true"] .count{background:var(--accent-wash);color:var(--accent-ink)}

/* ---- section furniture ---- */
.sec{margin-bottom:34px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-head h2{font-size:17px}
.sec-note{font-size:12.5px;color:var(--ink-2);max-width:68ch;margin:-4px 0 14px}
.eyebrow{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600}
.spacer{margin-left:auto}

.panelbox{background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow-1)}
.panelbox-pad{padding:16px 18px}

/* ---- stat strip ---- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.stat{background:var(--card);padding:13px 15px;display:flex;flex-direction:column;gap:3px}
.stat-k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat-v{font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.stat-c{font-size:11.5px;color:var(--ink-2)}

/* ---- attention queue ---- */
.queue{display:flex;flex-direction:column}
.qrow{display:flex;gap:12px;align-items:center;padding:11px 16px 11px 13px;
  border-bottom:1px solid var(--rule);border-left:3px solid var(--sev,var(--rule-strong))}
.qrow:last-child{border-bottom:0}
.qrow .qbody{min-width:0;flex:1}
.qrow .qtitle{font-weight:600;font-size:13.5px}
.qrow .qmeta{font-size:12px;color:var(--ink-2)}
.qempty{padding:26px 16px;text-align:center;color:var(--ink-2);font-size:13px}

/* ---- pills, chips, status ---- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px 2px 7px;
  font-size:11px;font-weight:600;white-space:nowrap;line-height:1.7}
.pill svg{flex:none}
.pill.good{background:var(--good-wash);color:var(--ink)}
.pill.warning{background:var(--warning-wash);color:var(--ink)}
.pill.serious{background:var(--serious-wash);color:var(--ink)}
.pill.critical{background:var(--critical-wash);color:var(--ink)}
.pill.neutral{background:var(--card-3);color:var(--ink-2)}
.pill.accent{background:var(--accent-wash);color:var(--accent-ink)}
.pill.signal{background:var(--signal-wash);color:var(--signal-ink)}
.chip{display:inline-block;font-family:var(--font-mono);font-size:11px;padding:1px 6px;
  border:1px solid var(--rule-strong);border-radius:4px;color:var(--ink-2);background:var(--card-2)}
.code{font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:-.02em}

/* ---- buttons ---- */
.btn{appearance:none;border:1px solid var(--rule-strong);background:var(--card);border-radius:6px;
  padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--card-2);border-color:var(--muted)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:disabled:hover{background:var(--card);border-color:var(--rule-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.promo{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.promo:hover{background:var(--signal-ink);border-color:var(--signal-ink)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--card-3);color:var(--ink)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule-strong);border-radius:6px;overflow:hidden;background:var(--card)}
.stepper button{appearance:none;border:0;background:none;cursor:pointer;width:24px;height:26px;
  font-size:14px;line-height:1;color:var(--ink-2);font-weight:600}
.stepper button:hover{background:var(--card-3);color:var(--ink)}
.stepper .n{min-width:34px;text-align:center;font-size:12.5px;font-weight:600;
  font-variant-numeric:tabular-nums;border-inline:1px solid var(--rule)}

/* ---- form controls ---- */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.inp{border:1px solid var(--rule-strong);background:var(--card);border-radius:6px;padding:6px 9px;
  font-size:13px;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.filters{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.filters .field{min-width:132px}
.filters .grow{flex:1;min-width:180px}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;
  color:var(--ink-2);cursor:pointer;padding-bottom:7px}
.toggle input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.segmented{display:inline-flex;border:1px solid var(--rule-strong);border-radius:6px;overflow:hidden}
.segmented button{appearance:none;border:0;background:var(--card);padding:5px 11px;font-size:12px;
  font-weight:600;color:var(--ink-2);cursor:pointer}
.segmented button+button{border-left:1px solid var(--rule-strong)}
.segmented button[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent-ink)}

/* ---- tables ---- */
.tblwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--card);box-shadow:var(--shadow-1)}
table.tbl{width:100%;border-collapse:collapse;min-width:680px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:9px 12px;border-bottom:1px solid var(--rule);background:var(--card-2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--card-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nowrap{white-space:nowrap}
.rowbtn{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;
  font:inherit;color:inherit;font-weight:600}
.rowbtn:hover{color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}
.sub{font-size:11.5px;color:var(--muted)}

/* ---- meters ---- */
.meter{position:relative;height:8px;border-radius:999px;min-width:74px;
  background:color-mix(in oklab, var(--meter,var(--accent)) 16%, var(--card));overflow:hidden}
.meter>i{position:absolute;inset-block:0;left:0;background:var(--meter,var(--accent));
  border-radius:0 4px 4px 0;display:block}
.meter>u{position:absolute;inset-block:-2px;width:1px;background:var(--ink-2);opacity:.55}
.meter-row{display:flex;align-items:center;gap:9px}
.meter-lab{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}

/* ---- cards for real objects ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.icard{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 15px;
  display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow-1)}
.icard.hot{border-color:var(--signal);box-shadow:var(--shadow-1),inset 3px 0 0 var(--signal)}
.icard h3{font-size:14.5px;font-family:var(--font-ui);font-weight:700;letter-spacing:-.01em}
.icard .why{font-size:12px;color:var(--ink-2)}
.icard .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.interest{display:flex;align-items:baseline;gap:6px}
.interest b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.interest span{font-size:11.5px;color:var(--muted)}

/* ---- charts ---- */
.chartcard{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:16px 18px 12px;box-shadow:var(--shadow-1)}
.chart-title{font-size:13.5px;font-weight:700}
.chart-sub{font-size:12px;color:var(--ink-2);margin-top:2px;max-width:60ch}
.chart-scroll{overflow-x:auto;margin-top:14px}
svg .gridline{stroke:var(--grid);stroke-width:1}
svg .axisline{stroke:var(--axis);stroke-width:1}
svg text{font-family:var(--font-ui);fill:var(--muted)}
svg text.val{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
svg text.cat{fill:var(--ink-2)}
.hit{fill:transparent;cursor:pointer}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--card);border:1px solid var(--rule-strong);
  border-radius:7px;padding:9px 11px;box-shadow:var(--shadow-2);font-size:12px;max-width:250px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip h4{font-size:12.5px;margin:0 0 5px;font-family:var(--font-ui);font-weight:700}
.tip dl{display:grid;grid-template-columns:auto auto;gap:2px 12px;margin:0}
.tip dt{color:var(--ink-2)}
.tip dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* ---- slide-over ---- */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.38);z-index:40;border:0;width:100%;padding:0}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--card);z-index:50;
  border-left:1px solid var(--rule);box-shadow:var(--shadow-2);display:flex;flex-direction:column}
.drawer-head{padding:16px 18px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
.drawer-head h2{font-size:16px;line-height:1.25}
.drawer-body{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.drawer-foot{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap;background:var(--card-2)}
.block{display:flex;flex-direction:column;gap:9px}
.block>h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;font-family:var(--font-ui)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:500}
.people{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.person{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--rule);font-size:12.5px}
.person:last-child{border-bottom:0}
.person .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .pos{font-family:var(--font-mono);font-size:11px;color:var(--muted);width:20px;flex:none}
.scrolly{max-height:230px;overflow-y:auto}
.searchres{border:1px solid var(--rule);border-radius:7px;max-height:190px;overflow-y:auto}
.searchres:empty{display:none}

/* ---- misc ---- */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;
  background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:7px;font-size:12.5px;
  font-weight:500;box-shadow:var(--shadow-2);max-width:min(440px,92vw)}
.toast.warning{background:var(--warning);color:#231a05}
.toast.critical{background:var(--critical);color:#fff}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty h2{font-size:16px;margin-bottom:6px}
.formula{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);background:var(--card-2);
  border:1px solid var(--rule);border-radius:6px;padding:8px 11px;overflow-x:auto;white-space:nowrap}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<header class="masthead">
  <div class="masthead-in">
    <div class="mast-id">
      <svg class="crest" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 3 7v10.5C3 24 9 29.3 16 31c7-1.7 13-7 13-13.5V7L16 2Z" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
        <path d="M8.5 13.5h15M8.5 18h15" stroke="var(--accent)" stroke-width="1.3" opacity=".55"/>
        <path d="M16 9.2 10 11.6l6 2.4 6-2.4-6-2.4Z" fill="var(--accent)"/>
        <path d="M16 22.8V16" stroke="var(--accent)" stroke-width="1.6"/>
      </svg>
      <div>
        <div class="mast-name" id="mast-name">Halverson Ridge</div>
        <div class="mast-sub" id="mast-sub">Office of the Registrar</div>
      </div>
    </div>
    <div class="mast-facts" id="mast-facts"></div>
  </div>
</header>

<main class="shell">
  <nav class="tabs" role="tablist" aria-label="Console modules" id="tabs"></nav>
  <div id="view"></div>
</main>

<div id="drawer-root"></div>
<div id="toast-root"></div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =========================================================================
   Halverson Ridge Registrar — a staff console for stockroom, registration,
   and the demand signals that decide what gets promoted next term.
   Records live in the artifact's shared store; every viewer sees the same
   numbers and each other's edits as they happen.
   ========================================================================= */

const CLIENT_ID = 'sess-' + Math.random().toString(36).slice(2, 10);
const WEEK_COUNT = 8;

const state = {
  db: null, connected: false, loaded: false,
  tab: 'overview',
  courses: [], inventory: [], initiatives: [], campaigns: [],
  students: [], school: null, activity: [],
  filters: { invCat: 'all', invAttn: false, invQ: '', regDept: 'all', regAttn: false, regQ: '' },
  demandView: 'chart', trendCourse: null,
  drawer: null,
  pending: new Set()
};

/* ---------- small helpers ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const pct = n => Math.round(n * 100);
const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
function shortDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso.length <= 10 ? iso + 'T12:00:00Z' : iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
}
function daysAgo(iso) {
  if (!iso) return null;
  const d = new Date(iso.length <= 10 ? iso + 'T12:00:00Z' : iso);
  if (isNaN(d)) return null;
  return Math.round((Date.UTC(2026, 8, 12) - d.getTime()) / 86400000);
}
const ICONS = {
  good:'<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="none" stroke="var(--good)" stroke-width="1.6"/><path d="M3.6 6.2 5.2 7.8 8.5 4.4" fill="none" stroke="var(--good)" stroke-width="1.6" stroke-linecap="round"/></svg>',
  warning:'<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="var(--warning)"/><path d="M6 3.3v3.2" stroke="#231a05" stroke-width="1.6" stroke-linecap="round"/><circle cx="6" cy="8.7" r=".9" fill="#231a05"/></svg>',

  seat:'<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 5V2.8h7V5M1.6 5h8.8v3.2H1.6zM3 8.2v1.4M9 8.2v1.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
  box:'<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.4 10.6 3.6 6 5.8 1.4 3.6 6 1.4ZM1.4 3.6v4.8L6 10.6l4.6-2.2V3.6M6 5.8v4.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',

};
function pillHTML(kind, label) {
  return '<span class="pill ' + kind + '">' + (ICONS[kind] || '') + esc(label) + '</span>';
}

/* ---------- derived: registration ---------- */
const enrolledOf = c => (c.roster || []).filter(r => r.state === 'enrolled');
const waitlistOf = c => (c.roster || []).filter(r => r.state === 'waitlist')
  .sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : (a.sid < b.sid ? -1 : 1)));
const seatsLeft = c => Math.max(0, (c.capacity || 0) - enrolledOf(c).length);

/* Demand index — published so staff can argue with it, not a black box.
   fill     enrolled / capacity                          weight .40
   pressure waitlist / capacity                          weight .35
   velocity signups in the last 2 weeks / (capacity×.6)   weight .25   */
function demandOf(c) {
  const cap = Math.max(1, c.capacity || 1);
  const sig = c.signups || [];
  const recent = sig.slice(-2).reduce((a, b) => a + (b || 0), 0);
  const fill = clamp(enrolledOf(c).length / cap, 0, 1);
  const pressure = clamp(waitlistOf(c).length / cap, 0, 1);
  const velocity = clamp(recent / (cap * 0.6), 0, 1);
  return {
    score: Math.round(100 * (0.40 * fill + 0.35 * pressure + 0.25 * velocity)),
    fill, pressure, velocity, recent
  };
}
const DEMAND_BANDS = [
  { min: 70, kind: 'critical', label: 'Over-subscribed' },
  { min: 52, kind: 'serious',  label: 'High demand' },
  { min: 32, kind: 'warning',  label: 'Healthy' },
  { min: 0,  kind: 'good',     label: 'Seats to fill' }
];
const demandBand = score => DEMAND_BANDS.find(b => score >= b.min);

/* ---------- derived: inventory ---------- */
function stockOf(it) {
  const par = Math.max(1, it.par || 1);
  const ratio = (it.onHand || 0) / par;
  let kind, label;
  if ((it.onHand || 0) <= (it.reorderPoint || 0) * 0.55) { kind = 'critical'; label = 'Critical'; }
  else if ((it.onHand || 0) <= (it.reorderPoint || 0)) { kind = 'serious'; label = 'Below reorder'; }
  else if ((it.onHand || 0) <= (it.reorderPoint || 0) * 1.25) { kind = 'warning'; label = 'Watch'; }
  else { kind = 'good'; label = 'Stocked'; }
  return { kind, label, ratio: clamp(ratio, 0, 1), par, needs: kind === 'critical' || kind === 'serious' };
}
const meterColor = kind => kind === 'critical' ? 'var(--critical)' : kind === 'serious' ? 'var(--serious)'
  : kind === 'warning' ? 'var(--warning)' : 'var(--accent)';
const shortfall = it => Math.max(0, (it.par || 0) - (it.onHand || 0));

/* ---------- derived: the attention queue ---------- */
function attentionItems() {
  const out = [];
  state.courses.forEach(c => {
    const d = demandOf(c), wl = waitlistOf(c).length;
    if (wl >= c.capacity * 0.5) out.push({
      sev: 'critical', rank: 100 + d.score,
      title: c.title + ' has a waitlist deep enough for another section',
      meta: plural(wl, 'student') + ' waiting · ' + pct(wl / c.capacity) + '% of a ' + c.capacity + '-seat section',
      action: { label: 'Open a section', fn: () => openDrawer({ kind: 'section', code: c.code }) },
      alt: { label: 'Roster', fn: () => openDrawer({ kind: 'roster', code: c.code }) }
    });
    else if (wl > 0) out.push({
      sev: 'serious', rank: 60 + d.score,
      title: c.title + ' is full with students still waiting',
      meta: plural(wl, 'student') + ' on the waitlist · ' + c.capacity + ' seats',
      action: { label: 'Open roster', fn: () => openDrawer({ kind: 'roster', code: c.code }) }
    });
    if (enrolledOf(c).length / Math.max(1, c.capacity) < 0.55) out.push({
      sev: 'warning', rank: 30 - d.score,
      title: c.title + ' is under-enrolled with add/drop closing',
      meta: seatsLeft(c) + ' of ' + c.capacity + ' seats open · add/drop closes ' + shortDate(state.school && state.school.addDropCloses),
      action: { label: 'Promote it', fn: () => openDrawer({ kind: 'campaign', target: c.code, targetKind: 'course' }) }
    });
  });
  state.inventory.forEach(it => {
    const s = stockOf(it);
    if (!s.needs) return;
    const linked = (it.linkedCourses || []).filter(code => state.courses.some(c => c.code === code));
    out.push({
      sev: s.kind, rank: s.kind === 'critical' ? 95 : 55,
      title: it.name + ' is ' + (s.kind === 'critical' ? 'nearly out' : 'below its reorder point'),
      meta: it.onHand + ' ' + it.unit + (it.onHand === 1 ? '' : 's') + ' on hand · reorder at ' + it.reorderPoint
        + (linked.length ? ' · needed by ' + linked.join(', ') : ''),
      action: {
        label: it.requisitioned ? 'On requisition' : 'Add to requisition',
        disabled: !!it.requisitioned,
        fn: () => requisition(it.sku, true)
      },
      alt: { label: 'Open item', fn: () => openDrawer({ kind: 'item', sku: it.sku }) }
    });
  });
  return out.sort((a, b) => b.rank - a.rank);
}

/* ---------- store wiring ---------- */
async function connect() {
  let db = null;
  try { db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; }
  catch (e) { db = null; }
  state.db = db;
  state.connected = !!db;
  if (!db) { state.loaded = true; render(); return; }

  const onErr = e => {
    if (e && e.code === 'revoked') { state.connected = false; render(); }
    else if (e && e.code === 'resource_exhausted') toast('Too many live updates at once. Reload to resume.', 'warning');
  };
  const bind = (path, key, sort) => db.collection(path).onSnapshot(snap => {
    state[key] = snap.docs.map(d => d.data()).filter(Boolean);
    if (sort) state[key].sort(sort);
    state.loaded = true;
    render();
  }, onErr);

  bind('courses', 'courses', (a, b) => (a.order ?? 99) - (b.order ?? 99) || (a.code < b.code ? -1 : 1));
  bind('inventory', 'inventory', (a, b) => (a.category < b.category ? -1 : a.category > b.category ? 1 : (a.name < b.name ? -1 : 1)));
  bind('initiatives', 'initiatives', (a, b) => (b.interest || 0) - (a.interest || 0));
  bind('campaigns', 'campaigns', (a, b) => (b.starts < a.starts ? -1 : 1));
  db.doc('catalog/students').onSnapshot(s => { state.students = (s.data() || {}).list || []; render(); }, onErr);
  db.doc('meta/school').onSnapshot(s => { state.school = s.data() || null; render(); }, onErr);
  db.doc('meta/activity').onSnapshot(s => { state.activity = (s.data() || {}).entries || []; render(); }, onErr);
}

const ERR_TEXT = {
  invalid_argument: 'That edit was refused by the record store. Nothing was saved.',
  resource_exhausted: 'Too many edits at once. Wait a moment and try again.',
  quota_exceeded: 'The record store is full. Delete something before adding more.',
  unavailable: 'The record store did not answer. Try again.',
  revoked: 'Your access to these records ended. Reload the page.',
  not_granted: 'This view cannot write to the records.',
  capability_disabled: 'This view cannot write to the records.'
};
function errText(e) { return (e && ERR_TEXT[e.code]) || 'That change did not save. Try again.'; }

async function write(fn, okMsg) {
  if (!state.db) { toast('Not connected to the records — nothing was saved.', 'warning'); return false; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) { toast(errText(e), e && e.code === 'unavailable' ? 'warning' : 'critical'); return false; }
}

/* A seat is a scarce thing: take a short lease so two staff registering at
   the same moment can't both claim the last one. */
async function mutateCourse(code, fn, okMsg) {
  if (!state.db) { toast('Not connected to the records — nothing was saved.', 'warning'); return false; }
  const ref = state.db.doc('courses/' + code);
  try {
    const lease = await ref.acquire({ holder: CLIENT_ID, ttlMs: 6000 });
    if (!lease.acquired) {
      toast('Someone else is editing this roster right now. Try again in a few seconds.', 'warning');
      return false;
    }
    const snap = await ref.get();
    if (!snap.exists) { toast('That class is no longer in the catalog.', 'critical'); return false; }
    const body = JSON.parse(JSON.stringify(snap.data()));
    const verdict = fn(body);
    if (verdict === false) return false;
    await ref.set(body);
    if (okMsg) toast(typeof verdict === 'string' ? verdict : okMsg);
    return true;
  } catch (e) { toast(errText(e), 'critical'); return false; }
}

function logActivity(text, kind) {
  if (!state.db) return;
  const entry = { at: new Date().toISOString(), text, kind };
  const next = [entry].concat(state.activity || []).slice(0, 40);
  state.db.doc('meta/activity').set({ entries: next }).catch(() => {});
}

/* =========================== actions ================================== */

async function registerStudent(code, sid) {
  const st = state.students.find(s => s.sid === sid);
  if (!st) return;
  await mutateCourse(code, body => {
    body.roster = body.roster || [];
    if (body.roster.some(r => r.sid === sid)) { toast(st.name + ' is already on this roster.', 'warning'); return false; }
    const seatFree = body.roster.filter(r => r.state === 'enrolled').length < (body.capacity || 0);
    const entry = {
      sid: st.sid, name: st.name, grade: st.grade,
      state: seatFree ? 'enrolled' : 'waitlist',
      at: new Date().toISOString().slice(0, 10)
    };
    body.roster.push(entry);
    const sig = (body.signups || []).slice();
    if (sig.length) sig[sig.length - 1] = (sig[sig.length - 1] || 0) + 1;
    body.signups = sig;
    const where = seatFree ? 'enrolled in' : 'added to the waitlist for';
    logActivity(st.name + ' ' + where + ' ' + body.title + '.', 'registration');
    return st.name + (seatFree
      ? ' is enrolled — ' + (body.capacity - body.roster.filter(r => r.state === 'enrolled').length) + ' seats left.'
      : ' joined the waitlist at position ' + body.roster.filter(r => r.state === 'waitlist').length + '.');
  }, 'Registered.');
}

async function dropStudent(code, sid) {
  await mutateCourse(code, body => {
    const row = (body.roster || []).find(r => r.sid === sid);
    if (!row) return false;
    body.roster = body.roster.filter(r => r.sid !== sid);
    logActivity(row.name + ' dropped from ' + body.title + '.', 'registration');
    return row.name + ' was dropped from ' + body.title + '.';
  }, 'Dropped.');
}

async function promoteFromWaitlist(code, sid) {
  await mutateCourse(code, body => {
    const enrolled = (body.roster || []).filter(r => r.state === 'enrolled').length;
    if (enrolled >= (body.capacity || 0)) {
      toast('No open seat. Raise the cap or drop someone first.', 'warning');
      return false;
    }
    const row = (body.roster || []).find(r => r.sid === sid && r.state === 'waitlist');
    if (!row) return false;
    row.state = 'enrolled';
    row.at = new Date().toISOString().slice(0, 10);
    logActivity(row.name + ' moved off the waitlist into ' + body.title + '.', 'registration');
    return row.name + ' took a seat in ' + body.title + '.';
  }, 'Moved off the waitlist.');
}

async function setCapacity(code, next) {
  await mutateCourse(code, body => {
    const enrolled = (body.roster || []).filter(r => r.state === 'enrolled').length;
    const cap = clamp(Math.round(next), 1, 120);
    if (cap < enrolled) { toast('Cap cannot go below the ' + enrolled + ' students already enrolled.', 'warning'); return false; }
    body.capacity = cap;
    return 'Cap for ' + body.code + ' set to ' + cap + ' seats.';
  }, 'Capacity updated.');
}

/* Opening a section is the capacity answer to demand: a new section letter,
   seeded with the students who were waiting on the original. */
async function openSection(code, opts) {
  const src = state.courses.find(c => c.code === code);
  if (!src) return;
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  const used = state.courses.filter(c => c.code.split('.')[0] === code.split('.')[0] || c.title === src.title)
    .map(c => c.section);
  const section = letters.find(l => !used.includes(l)) || 'Z';
  const newCode = src.code.split('.')[0] + '.' + section;
  const move = clamp(parseInt(opts.move, 10) || 0, 0, waitlistOf(src).length);
  const cap = clamp(parseInt(opts.capacity, 10) || src.capacity, 1, 120);
  const movers = waitlistOf(src).slice(0, Math.min(move, cap));

  const ok = await write(async () => {
    await state.db.doc('courses/' + newCode).set({
      code: newCode, title: src.title, dept: src.dept,
      teacher: opts.teacher || src.teacher, period: parseInt(opts.period, 10) || src.period,
      room: opts.room || src.room, section, term: src.term,
      capacity: cap, status: 'open', isNew: true,
      description: src.description, signups: new Array(WEEK_COUNT).fill(0),
      roster: movers.map(r => ({ ...r, state: 'enrolled', at: new Date().toISOString().slice(0, 10) })),
      fromInitiative: null, order: (src.order ?? 0) + 0.5
    });
  });
  if (!ok) return;
  if (movers.length) {
    const ids = new Set(movers.map(r => r.sid));
    await mutateCourse(code, body => { body.roster = (body.roster || []).filter(r => !ids.has(r.sid)); });
  }
  logActivity('Section ' + section + ' of ' + src.title + ' opened with ' + plural(movers.length, 'student') + ' moved off the waitlist.', 'registration');
  closeDrawer();
  state.tab = 'registration';
  toast(newCode + ' created — ' + plural(movers.length, 'student') + ' moved in from the waitlist.');
  render();
}

/* ---------- inventory ---------- */
async function adjustStock(sku, delta) {
  const it = state.inventory.find(i => i.sku === sku);
  if (!it) return;
  const next = Math.max(0, (it.onHand || 0) + delta);
  await write(() => state.db.doc('inventory/' + sku).update({ onHand: next }));
}
async function countStock(sku, value) {
  const it = state.inventory.find(i => i.sku === sku);
  if (!it) return;
  const n = Math.max(0, Math.round(Number(value)));
  if (!isFinite(n)) { toast('Enter a whole number of ' + it.unit + 's.', 'warning'); return; }
  const ok = await write(() => state.db.doc('inventory/' + sku)
    .update({ onHand: n, lastCounted: new Date().toISOString().slice(0, 10) }),
    it.name + ' counted: ' + n + ' on hand.');
  if (ok) logActivity(it.name + ' counted: ' + n + ' ' + it.unit + (n === 1 ? '' : 's') + ' on hand.', 'inventory');
}
async function setItemField(sku, field, value) {
  const n = Math.max(0, Math.round(Number(value)));
  if (!isFinite(n)) return;
  await write(() => state.db.doc('inventory/' + sku).update({ [field]: n }));
}
async function requisition(sku, on) {
  const it = state.inventory.find(i => i.sku === sku);
  if (!it) return;
  const ok = await write(() => state.db.doc('inventory/' + sku).update({ requisitioned: !!on }),
    on ? it.name + ' added to the requisition.' : it.name + ' removed from the requisition.');
  if (ok && on) logActivity(it.name + ' added to the open requisition (' + shortfall(it) + ' ' + it.unit + 's to par).', 'inventory');
}
async function requisitionAllLow() {
  const low = state.inventory.filter(i => stockOf(i).needs && !i.requisitioned);
  if (!low.length) { toast('Nothing is below its reorder point.'); return; }
  if (!state.db) { toast('Not connected to the records — nothing was saved.', 'warning'); return; }
  const ok = await write(() => Promise.all(low.map(i =>
    state.db.doc('inventory/' + i.sku).update({ requisitioned: true }))),
    plural(low.length, 'item') + ' added to the requisition.');
  if (ok) logActivity(plural(low.length, 'item') + ' below reorder added to the open requisition.', 'inventory');
}
async function addItem(form) {
  const sku = (form.sku || '').trim().toUpperCase().replace(/[^A-Z0-9-]/g, '-');
  if (!sku || !(form.name || '').trim()) { toast('An item needs a SKU and a name.', 'warning'); return; }
  if (state.inventory.some(i => i.sku === sku)) { toast('SKU ' + sku + ' is already in the stockroom.', 'warning'); return; }
  const ok = await write(() => state.db.doc('inventory/' + sku).set({
    sku, name: form.name.trim(), category: form.category || 'Facilities',
    unit: (form.unit || 'unit').trim(), onHand: Math.max(0, parseInt(form.onHand, 10) || 0),
    reorderPoint: Math.max(0, parseInt(form.reorderPoint, 10) || 0),
    par: Math.max(1, parseInt(form.par, 10) || 1),
    location: (form.location || '').trim() || 'Main supply room',
    supplier: (form.supplier || '').trim() || 'Central District Warehouse',
    unitCost: Math.max(0, Number(form.unitCost) || 0),
    lastCounted: new Date().toISOString().slice(0, 10),
    linkedCourses: [], requisitioned: false
  }), sku + ' added to the stockroom.');
  if (ok) { closeDrawer(); logActivity(form.name.trim() + ' added to the stockroom.', 'inventory'); }
}

/* ---------- initiatives & promotion ---------- */
async function bumpInterest(id, delta) {
  const ini = state.initiatives.find(i => i.id === id);
  if (!ini) return;
  await write(() => state.db.doc('initiatives/' + id).update({ interest: Math.max(0, (ini.interest || 0) + delta) }));
}
const NEXT_STAGE = { proposed: 'piloting', piloting: 'approved', shelved: 'proposed' };
async function advanceInitiative(id) {
  const ini = state.initiatives.find(i => i.id === id);
  if (!ini) return;
  const next = NEXT_STAGE[ini.status] || 'approved';
  const ok = await write(() => state.db.doc('initiatives/' + id).update({ status: next }),
    ini.title + ' moved to ' + next + '.');
  if (ok) logActivity(ini.title + ' moved from ' + ini.status + ' to ' + next + '.', 'promotion');
}
async function shelveInitiative(id) {
  const ini = state.initiatives.find(i => i.id === id);
  if (!ini) return;
  const ok = await write(() => state.db.doc('initiatives/' + id).update({ status: 'shelved' }),
    ini.title + ' shelved.');
  if (ok) logActivity(ini.title + ' shelved for this term.', 'promotion');
}
async function addInitiative(form) {
  if (!(form.title || '').trim()) { toast('Give the initiative a name.', 'warning'); return; }
  let n = state.initiatives.length + 1, guard = 0;
  let id = 'INIT-' + String(n).padStart(2, '0');
  while (state.initiatives.some(i => i.id === id) && guard++ < 99) id = 'INIT-' + String(++n).padStart(2, '0');
  const ok = await write(() => state.db.doc('initiatives/' + id).set({
    id, title: form.title.trim(), kind: form.kind || 'Club',
    proposedBy: (form.proposedBy || '').trim() || 'Registrar',
    interest: Math.max(0, parseInt(form.interest, 10) || 0),
    askCapacity: Math.max(1, parseInt(form.askCapacity, 10) || 20),
    status: 'proposed', window: (form.window || '').trim() || 'Not scheduled',
    note: (form.note || '').trim(), source: 'Logged in the console'
  }), form.title.trim() + ' added to the demand board.');
  if (ok) { closeDrawer(); logActivity(form.title.trim() + ' proposed as a new ' + (form.kind || 'Club') + '.', 'promotion'); }
}

/* Turning a popular initiative into a real, registerable class. */
async function scheduleInitiative(id, form) {
  const ini = state.initiatives.find(i => i.id === id);
  if (!ini) return;
  const code = (form.code || '').trim().toUpperCase().replace(/[^A-Z0-9.-]/g, '');
  if (!/^[A-Z]{2,4}-\d{2,3}$/.test(code)) { toast('Use a course code like ART-150.', 'warning'); return; }
  if (state.courses.some(c => c.code === code)) { toast(code + ' is already in the catalog.', 'warning'); return; }
  const ok = await write(async () => {
    await state.db.doc('courses/' + code).set({
      code, title: ini.title, dept: form.dept || 'Career & Tech',
      teacher: (form.teacher || '').trim() || ini.proposedBy.split(',')[0],
      period: parseInt(form.period, 10) || 0,
      room: (form.room || '').trim() || 'TBD', section: 'A', term: (state.school && state.school.term) || 'Fall 2026',
      capacity: Math.max(1, parseInt(form.capacity, 10) || ini.askCapacity),
      status: 'open', isNew: true, description: ini.note || '',
      signups: new Array(WEEK_COUNT).fill(0), roster: [], fromInitiative: ini.id, order: 99
    });
    await state.db.doc('initiatives/' + id).update({ status: 'scheduled', scheduledAs: code });
  }, ini.title + ' is on the schedule as ' + code + '.');
  if (ok) {
    logActivity(ini.title + ' scheduled as ' + code + ' after ' + ini.interest + ' interest signals.', 'promotion');
    closeDrawer();
    state.tab = 'registration';
    render();
  }
}

const CHANNELS = ['Morning bulletin', 'Homeroom slide', 'Family newsletter', 'Counselor outreach', 'Cafeteria poster'];
async function createCampaign(form) {
  if (!(form.headline || '').trim()) { toast('A campaign needs a headline.', 'warning'); return; }
  const n = state.campaigns.length + 1;
  let id = 'CMP-' + String(n).padStart(2, '0');
  let guard = 0;
  while (state.campaigns.some(c => c.id === id) && guard++ < 99) id = 'CMP-' + String(n + guard).padStart(2, '0');
  const ok = await write(() => state.db.doc('campaigns/' + id).set({
    id, target: form.target, targetKind: form.targetKind,
    headline: form.headline.trim(), channel: form.channel || CHANNELS[0],
    starts: form.starts, ends: form.ends, status: 'running', note: (form.note || '').trim()
  }), 'Campaign scheduled on the ' + (form.channel || CHANNELS[0]).toLowerCase() + '.');
  if (ok) {
    logActivity('Campaign "' + form.headline.trim() + '" started on ' + (form.channel || CHANNELS[0]) + '.', 'promotion');
    closeDrawer();
    state.tab = 'demand';
    render();
  }
}
async function stopCampaign(id) {
  const c = state.campaigns.find(x => x.id === id);
  if (!c) return;
  await write(() => state.db.doc('campaigns/' + id).update({ status: 'ended', ends: new Date().toISOString().slice(0, 10) }),
    'Campaign ended.');
}

/* ============================ charts ================================== */
let TIPS = [];
function tipRef(html) { TIPS.push(html); return TIPS.length - 1; }

function roundedBar(x0, y, x1, h, r) {
  const w = x1 - x0;
  if (w <= r + 1) return '<rect x="' + x0 + '" y="' + y + '" width="' + Math.max(1, w) + '" height="' + h + '"';
  return '<path d="M' + x0 + ' ' + y + 'H' + (x1 - r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r
    + 'V' + (y + h - r) + 'a' + r + ' ' + r + ' 0 0 1 ' + (-r) + ' ' + r + 'H' + x0 + 'Z"';
}

/* Ranked demand — one series, so one color for every bar and no legend box. */
function demandChart(rows) {
  const W = 700, padL = 176, padR = 52, padT = 26, padB = 6;
  const rowH = 27, barH = 15;
  const H = padT + rows.length * rowH + padB;
  const x = v => padL + (v / 100) * (W - padL - padR);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H
    + '" style="min-width:560px;display:block" role="img" aria-label="Demand index by class, ranked">';
  [0, 25, 50, 75, 100].forEach(t => {
    s += '<line class="gridline" x1="' + x(t) + '" y1="' + (padT - 6) + '" x2="' + x(t) + '" y2="' + (H - padB) + '"/>';
    s += '<text x="' + x(t) + '" y="' + (padT - 12) + '" font-size="10" text-anchor="middle">' + t + '</text>';
  });
  s += '<line class="axisline" x1="' + padL + '" y1="' + (padT - 6) + '" x2="' + padL + '" y2="' + (H - padB) + '"/>';
  rows.forEach((r, i) => {
    const y = padT + i * rowH, top = y + (rowH - barH) / 2;
    const band = demandBand(r.d.score);
    const tip = tipRef('<h4>' + esc(r.c.title) + '</h4><dl>'
      + '<dt>Demand index</dt><dd>' + r.d.score + '</dd>'
      + '<dt>Seats filled</dt><dd>' + pct(r.d.fill) + '%</dd>'
      + '<dt>Waitlist vs cap</dt><dd>' + pct(r.d.pressure) + '%</dd>'
      + '<dt>Last 2 weeks</dt><dd>' + plural(r.d.recent, 'signup') + '</dd>'
      + '</dl><div style="margin-top:6px">' + pillHTML(band.kind, band.label) + '</div>');
    const label = r.c.title.length > 25 ? r.c.title.slice(0, 24) + '…' : r.c.title;
    s += '<text class="cat" x="' + (padL - 10) + '" y="' + (y + rowH / 2) + '" font-size="11.5" text-anchor="end" dominant-baseline="middle">' + esc(label) + '</text>';
    s += roundedBar(padL, top, x(r.d.score), barH, 4) + ' fill="var(--accent)"/>';
    s += '<text class="val" x="' + (x(r.d.score) + 7) + '" y="' + (y + rowH / 2) + '" font-size="11.5" dominant-baseline="middle">' + r.d.score + '</text>';
    s += '<rect class="hit" x="0" y="' + y + '" width="' + W + '" height="' + rowH + '" tabindex="0" role="button"'
      + ' aria-label="' + esc(r.c.title) + ', demand index ' + r.d.score + '. Show weekly signups."'
      + ' data-tip="' + tip + '" data-act="trend" data-code="' + esc(r.c.code) + '"/>';
  });
  s += '</svg>';
  return s;
}

/* Weekly signup trend for one class — single series, endpoint labelled. */
function trendChart(c) {
  const sig = (c.signups || []).slice(-WEEK_COUNT);
  if (sig.length < 2) return '<p class="sub" style="margin:14px 0 4px">'
    + 'No weekly signups recorded for this class yet — the trend appears once registration opens.</p>';
  const W = 700, H = 188, padL = 34, padR = 54, padT = 16, padB = 28;
  const max = Math.max(4, Math.ceil(Math.max.apply(null, sig.concat([0])) / 4) * 4);
  const bw = (W - padL - padR) / Math.max(1, sig.length - 1);
  const x = i => padL + i * bw;
  const y = v => padT + (1 - v / max) * (H - padT - padB);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H
    + '" style="min-width:460px;display:block" role="img" aria-label="Weekly signups for ' + esc(c.title) + '">';
  [0, max / 2, max].forEach(t => {
    s += '<line class="gridline" x1="' + padL + '" y1="' + y(t) + '" x2="' + (W - padR) + '" y2="' + y(t) + '"/>';
    s += '<text x="' + (padL - 8) + '" y="' + y(t) + '" font-size="10" text-anchor="end" dominant-baseline="middle">' + t + '</text>';
  });
  const line = sig.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  s += '<path d="' + line + ' L' + x(sig.length - 1).toFixed(1) + ' ' + y(0) + ' L' + padL + ' ' + y(0) + ' Z" fill="var(--accent)" opacity=".1"/>';
  s += '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  s += '<line class="axisline" x1="' + padL + '" y1="' + y(0) + '" x2="' + (W - padR) + '" y2="' + y(0) + '"/>';
  sig.forEach((v, i) => {
    s += '<text x="' + x(i) + '" y="' + (H - padB + 15) + '" font-size="10" text-anchor="middle">W' + (i + 1) + '</text>';
    const tip = tipRef('<h4>Week ' + (i + 1) + '</h4><dl><dt>Signups</dt><dd>' + v + '</dd>'
      + '<dt>Class</dt><dd>' + esc(c.code) + '</dd></dl>');
    s += '<rect class="hit" x="' + (x(i) - bw / 2) + '" y="' + padT + '" width="' + bw + '" height="' + (H - padT - padB)
      + '" data-tip="' + tip + '"/>';
  });
  const last = sig.length - 1;
  s += '<circle cx="' + x(last) + '" cy="' + y(sig[last]) + '" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>';
  s += '<text class="val" x="' + (x(last) + 10) + '" y="' + y(sig[last]) + '" font-size="11.5" dominant-baseline="middle">'
    + sig[last] + '/wk</text>';
  s += '</svg>';
  return s;
}

function meterHTML(ratio, kind, tick) {
  return '<span class="meter" style="--meter:' + meterColor(kind) + '">'
    + '<i style="width:' + clamp(ratio * 100, 0, 100).toFixed(1) + '%"></i>'
    + (tick != null ? '<u style="left:' + clamp(tick * 100, 0, 100).toFixed(1) + '%"></u>' : '')
    + '</span>';
}
